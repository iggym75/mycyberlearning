name: Site stats

# Run from the Actions tab (Run workflow) to see visitors, subscribers and engagement. Totals only, nothing personal.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days to look back"
        default: "30"

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund --ignore-scripts --omit=dev
      - name: Stats
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          DAYS: ${{ inputs.days }}
        run: node scripts/stats.mjs --days "$DAYS"
