# Weekly My List update: Mondays 08:00 UK time, to account holders who ticked it (podcasts only).
# Two schedules cover GMT and BST; the script only sends on Monday between 08:00 and 08:59 London time.
name: Weekly My List update

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run counts recipients; send-now sends today (at most once a day per person)"
        type: choice
        options: [dry-run, send-now]
        default: dry-run
  schedule:
    - cron: "5 7 * * 1"   # 08:05 BST
    - cron: "5 8 * * 1"   # 08:05 GMT

permissions: { contents: read }
concurrency: { group: weekly-email, cancel-in-progress: false }

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund --ignore-scripts --omit=dev
      - name: Send the weekly update
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          MAIL_PROVIDER: ${{ vars.MAIL_PROVIDER || 'resend' }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          MAIL_FROM: ${{ vars.MAIL_FROM || 'My Cyber Learning <briefing@mycyberlearning.co.uk>' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://mycyberlearning.co.uk' }}
          MAIL_RATE_PER_MINUTE: ${{ vars.MAIL_RATE_PER_MINUTE || '25' }}
          MAIL_DAILY_LIMIT: ${{ vars.MAIL_DAILY_LIMIT || '' }}
        run: node scripts/send-weekly.mjs ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'send-now' && '--force' || '--dry-run') || '' }}
