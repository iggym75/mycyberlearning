name: tmp cron check
on: { push: { branches: [tmp/cron-check] } }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Worker log lines 08:25-08:40 (read-only)
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for day in 2026-11-27 2026-11-28; do
          b='{"timeframe":{"from":'$(date -d "${day}T08:25:00Z" +%s000)',"to":'$(date -d "${day}T08:40:00Z" +%s000)'},"view":"events","limit":20,"queryId":"cron-check"}'
          echo "== $day"
          curl -s "https://api.cloudflare.com/client/v4/accounts/$A/workers/observability/telemetry/query" -H "Authorization: Bearer $T" -H "content-type: application/json" -d "$b" > out.json
          jq -c '.success, (.errors|tostring)' out.json
          jq -r '.. | objects | select(has("message")) | .message | strings' out.json | grep -i "trigger\|answered\|dispatch" | sort -u | head
          done
