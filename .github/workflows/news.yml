name: Daily news briefing

# Runs at 05:07 and 06:07 UTC. Exactly one of these starts between 06:00 and 06:59 London time
# (06:07 in winter/GMT, 05:07 in summer/BST); the other run exits straight away.
on:
  schedule:
    - cron: "7 5 * * *"
    - cron: "7 6 * * *"
  workflow_dispatch:
    inputs:
      send:
        description: "Email subscribers after building (once per day at most)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency: { group: news, cancel-in-progress: false }

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          hour=$(TZ=Europe/London date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" = "06" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; echo "London hour is $hour; skipping."; fi

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, persist-credentials: false }   # no git token on disk while untrusted feeds are parsed
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # --ignore-scripts: dependency install scripts never run, and no secrets are in the environment yet.
      - run: npm install --no-audit --no-fund --ignore-scripts --omit=dev   # switch to `npm ci --ignore-scripts` once package-lock.json is committed
      - name: Build today's briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-5-5' }}
        run: node scripts/news.mjs --local   # shows come from the catalogue snapshot, so this job holds no database token
      - name: Commit the briefing
        env:
          GH_TOKEN: ${{ github.token }}   # only this step can push
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add frontend/news
          git diff --cached --quiet && exit 0
          git commit -m "news: daily briefing $(TZ=Europe/London date +%F)"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done; exit 1

  deploy:
    needs: build
    permissions: { contents: read }
    uses: ./.github/workflows/deploy.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  email:
    needs: [gate, build]
    if: needs.gate.outputs.go == 'true' && (github.event_name == 'schedule' || inputs.send)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production   # optional: add required reviewers or restrict secrets to this environment
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund --ignore-scripts --omit=dev
      - name: Email subscribers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          MAIL_PROVIDER: ${{ vars.MAIL_PROVIDER || 'resend' }}
          MAIL_API_KEY: ${{ secrets.MAIL_API_KEY }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          MAIL_FROM: ${{ vars.MAIL_FROM || 'My Cyber Learning <briefing@mycyberlearning.co.uk>' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://mycyberlearning.co.uk' }}
          MAIL_RATE_PER_MINUTE: ${{ vars.MAIL_RATE_PER_MINUTE || '25' }}
          MAIL_DAILY_LIMIT: ${{ vars.MAIL_DAILY_LIMIT || '' }}
        # The gate job already checked the London hour; --force stops a late-starting run skipping the day.
        run: node scripts/send-digest.mjs --force

  retention:
    # Runs every day whatever happened above, so the 7-day deletion promised in the privacy notice never lapses.
    needs: gate
    if: always() && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund --ignore-scripts --omit=dev
      - name: Apply data retention
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        run: node scripts/cleanup.mjs
