name: Weekly catalogue refresh

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      retag:
        description: "Re-run Claude tagging on every unlocked entry"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: { group: refresh, cancel-in-progress: false }

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }   # no git token on disk while third-party feeds are parsed
      - uses: actions/setup-node@v7
        with: { node-version: 22 }   # add `cache: npm` once package-lock.json is committed
      - run: npm install --no-audit --no-fund --ignore-scripts --omit=dev   # switch to `npm ci --ignore-scripts` once package-lock.json is committed
      - name: Refresh metadata, ratings and tags
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-5-5' }}
          RATINGS_SOURCE: ${{ vars.RATINGS_SOURCE || 'podnews' }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}   # optional: fills missing Spotify links from Spotify's catalogue
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: node scripts/refresh.mjs ${{ inputs.retag && '--retag' || '' }}
      - name: Snapshot catalogue to the repo
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        run: npm run export
      - name: Commit snapshot and new artwork (the deploy job below then publishes it)
        env:
          GH_TOKEN: ${{ github.token }}   # only this step can push
        run: |
          git config user.name "catalogue-bot"
          git config user.email "catalogue-bot@users.noreply.github.com"
          git add data/catalogue.json frontend/covers
          git diff --cached --quiet && exit 0
          git commit -m "chore: weekly catalogue refresh $(date -u +%F)"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done; exit 1

  deploy:
    needs: refresh
    permissions: { contents: read }
    uses: ./.github/workflows/deploy.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
