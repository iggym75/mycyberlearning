name: Weekly catalogue refresh

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      retag:
        description: "Re-run Claude tagging on every unlocked entry"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: { group: refresh, cancel-in-progress: false }

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }   # add `cache: npm` once package-lock.json is committed
      - run: npm install --no-audit --no-fund --ignore-scripts   # switch to `npm ci --ignore-scripts` once package-lock.json is committed
      - name: Refresh metadata, ratings and tags
        env:
          STORAGE_CONNECTION_STRING: ${{ secrets.STORAGE_CONNECTION_STRING }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-5-5' }}
          RATINGS_SOURCE: ${{ vars.RATINGS_SOURCE || 'podnews' }}
        run: node scripts/refresh.mjs ${{ inputs.retag && '--retag' || '' }}
      - name: Snapshot catalogue to the repo
        env:
          STORAGE_CONNECTION_STRING: ${{ secrets.STORAGE_CONNECTION_STRING }}
        run: npm run export
      - name: Commit snapshot and new artwork (the deploy job below then publishes it)
        run: |
          git config user.name "catalogue-bot"
          git config user.email "catalogue-bot@users.noreply.github.com"
          git add data/catalogue.json frontend/covers
          git diff --cached --quiet && exit 0
          git commit -m "chore: weekly catalogue refresh $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done; exit 1

  deploy:
    needs: refresh
    permissions: { contents: read, pull-requests: write }   # a called workflow can't have more than its caller grants
    uses: ./.github/workflows/deploy.yml
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
