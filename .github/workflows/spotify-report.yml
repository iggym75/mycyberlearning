name: Spotify report

# Read-only: lists Spotify candidates for podcasts without a link, and security podcasts on Spotify that
# aren't in the catalogue. Writes only to the job log and summary. Run it from the Actions tab
# (Spotify report → Run workflow); it also runs on pull requests that change the report itself.
on:
  workflow_dispatch:
  pull_request:
    paths: [scripts/spotify-report.mjs, .github/workflows/spotify-report.yml]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts --omit=dev
      - name: Spotify report
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: node scripts/spotify-report.mjs
