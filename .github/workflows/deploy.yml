name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by the refresh and news workflows after they commit. Pushes made with GITHUB_TOKEN
  # deliberately don't trigger other workflows, so those jobs call this one directly.
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.event.number || 'main' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # When called after a commit, test and deploy the latest main rather than the commit that started the run.
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund --ignore-scripts --omit=dev   # runtime deps only; wrangler comes from the deploy action
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true   # reported in the log; Dependabot raises the fix PRs
      - run: npm test
      - run: npm run build

  # Pull requests are tested only; nothing from a PR is ever deployed.
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund --ignore-scripts --omit=dev
      - run: npm run build
      - name: Apply database migrations and deploy the Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: |
            d1 migrations apply mycyberlearning --remote
            deploy
